<svg xmlns="http://www.w3.org/2000/svg" width="128" height="80" viewBox="0 0 128 80" shape-rendering="crispEdges">
<!-- Transparent 4-frame walk cycles: groom row 0, bride row 1. Each cell 32x40. -->
<defs>
 <g id="groom">
  <rect x="8" y="36" width="16" height="2" fill="#25365d"/>
  <rect x="10" y="30" width="5" height="7" fill="#233e7c"/><rect x="18" y="30" width="5" height="7" fill="#233e7c"/>
  <rect x="8" y="35" width="8" height="3" fill="#5a4039"/><rect x="18" y="35" width="8" height="3" fill="#5a4039"/>
  <rect x="10" y="19" width="13" height="13" fill="#31569d"/><rect x="15" y="20" width="4" height="12" fill="#e94779"/>
  <rect x="7" y="21" width="4" height="9" fill="#31569d"/><rect x="22" y="21" width="4" height="9" fill="#31569d"/>
  <rect x="6" y="28" width="4" height="4" fill="#e8a27e"/><rect x="23" y="28" width="4" height="4" fill="#e8a27e"/>
  <rect x="14" y="15" width="5" height="6" fill="#d99470"/>
  <rect x="10" y="5" width="13" height="12" fill="#eeb18d"/>
  <rect x="9" y="3" width="15" height="6" fill="#51342e"/><rect x="11" y="1" width="11" height="4" fill="#684337"/>
  <rect x="8" y="7" width="4" height="8" fill="#51342e"/><rect x="21" y="7" width="4" height="7" fill="#51342e"/>
  <rect x="12" y="9" width="2" height="2" fill="#263450"/><rect x="19" y="9" width="2" height="2" fill="#263450"/>
  <rect x="15" y="13" width="4" height="1" fill="#a65b55"/>
 </g>
 <g id="bride">
  <rect x="8" y="36" width="16" height="2" fill="#25365d"/>
  <rect x="10" y="30" width="5" height="7" fill="#fff0e6"/><rect x="18" y="30" width="5" height="7" fill="#fff0e6"/>
  <rect x="8" y="35" width="8" height="3" fill="#68473e"/><rect x="18" y="35" width="8" height="3" fill="#68473e"/>
  <rect x="11" y="19" width="12" height="11" fill="#fff7e9"/><rect x="8" y="25" width="18" height="7" fill="#f0cbd6"/>
  <rect x="12" y="20" width="10" height="11" fill="#fffdf5"/><rect x="15" y="22" width="4" height="4" fill="#e94779"/>
  <rect x="8" y="20" width="4" height="9" fill="#f0cbd6"/><rect x="22" y="20" width="4" height="9" fill="#f0cbd6"/>
  <rect x="14" y="15" width="5" height="6" fill="#d99470"/>
  <rect x="10" y="5" width="13" height="12" fill="#efb18c"/>
  <rect x="8" y="2" width="17" height="7" fill="#58372f"/><rect x="7" y="6" width="4" height="13" fill="#58372f"/><rect x="22" y="6" width="4" height="13" fill="#58372f"/>
  <rect x="11" y="0" width="12" height="4" fill="#694438"/>
  <rect x="12" y="9" width="2" height="2" fill="#263450"/><rect x="19" y="9" width="2" height="2" fill="#263450"/>
  <rect x="15" y="13" width="4" height="1" fill="#a65b55"/>
  <rect x="12" y="0" width="3" height="3" fill="#ffe7a4"/><rect x="19" y="0" width="3" height="3" fill="#ffe7a4"/>
 </g>
</defs>
<!-- frame 1 -->
<use href="#groom" x="0" y="0"/><use href="#bride" x="0" y="40"/>
<!-- frame 2: stepping foot -->
<g transform="translate(32 0)"><use href="#groom"/><rect x="8" y="35" width="8" height="3" fill="#5a4039"/><rect x="20" y="34" width="7" height="3" fill="#5a4039"/><rect x="7" y="21" width="4" height="8" fill="#31569d"/></g>
<g transform="translate(32 40)"><use href="#bride"/><rect x="8" y="35" width="8" height="3" fill="#68473e"/><rect x="20" y="34" width="7" height="3" fill="#68473e"/></g>
<!-- frame 3: opposite step -->
<g transform="translate(64 0)"><use href="#groom"/><rect x="10" y="34" width="7" height="3" fill="#5a4039"/><rect x="18" y="35" width="8" height="3" fill="#5a4039"/><rect x="22" y="21" width="4" height="8" fill="#31569d"/></g>
<g transform="translate(64 40)"><use href="#bride"/><rect x="10" y="34" width="7" height="3" fill="#68473e"/><rect x="18" y="35" width="8" height="3" fill="#68473e"/></g>
<!-- frame 4: landing / happy pose -->
<g transform="translate(96 0)"><use href="#groom"/><rect x="5" y="19" width="4" height="9" fill="#31569d"/><rect x="24" y="19" width="4" height="9" fill="#31569d"/><rect x="4" y="16" width="4" height="4" fill="#e8a27e"/><rect x="25" y="16" width="4" height="4" fill="#e8a27e"/></g>
<g transform="translate(96 40)"><use href="#bride"/><rect x="5" y="18" width="4" height="10" fill="#f0cbd6"/><rect x="24" y="18" width="4" height="10" fill="#f0cbd6"/><rect x="4" y="15" width="4" height="4" fill="#e8a27e"/><rect x="25" y="15" width="4" height="4" fill="#e8a27e"/></g>
</svg>