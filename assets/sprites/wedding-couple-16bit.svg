<svg xmlns="http://www.w3.org/2000/svg" width="240" height="128" viewBox="0 0 240 128" shape-rendering="crispEdges">
<title>Wedding Adventure — detailed 16-bit couple sprite atlas</title>
<defs>
 <g id="groom" transform="translate(0 0)">
