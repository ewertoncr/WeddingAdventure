  <path d="M28 47h8v10h4v4H25v-4h3z" fill="#26334e"/>
  <rect x="9" y="58" width="12" height="4" fill="#18243d"/><rect x="27" y="58" width="13" height="4" fill="#18243d"/>
  <rect x="16" y="39" width="8" height="13" fill="#263c70"/><rect x="28" y="39" width="8" height="13" fill="#263c70"/>
  <rect x="17" y="42" width="3" height="9" fill="#4968a1"/><rect x="30" y="42" width="3" height="9" fill="#4968a1"/>
  <!-- jacket silhouette -->
  <path d="M13 24h22l7 7-3 18H10L8 31z" fill="#263e78"/>
  <path d="M13 25h8l4 7-5 17h-9l2-15z" fill="#3d5d9c"/>
  <path d="M28 25h7l7 7-3 17h-9l-3-17z" fill="#1e315f"/>
  <path d="M21 25h8l-2 8-3 5-4-5z" fill="#f4eee4"/>
  <path d="M24 31h4l2 10-4 4-4-4z" fill="#b94e59"/>
  <rect x="24" y="34" width="3" height="3" fill="#f2c76c"/>
  <rect x="14" y="37" width="4" height="3" fill="#8198c2"/><rect x="34" y="37" width="4" height="3" fill="#8198c2"/>
  <!-- arms -->
  <path d="M10 29H6v13h5v-6h3v-6z" fill="#263e78"/><rect x="5" y="40" width="6" height="5" fill="#d99a78"/>
  <path d="M36 29h5v13h-5v-6h-3v-6z" fill="#1e315f"/><rect x="36" y="40" width="6" height="5" fill="#d99a78"/>
  <!-- neck and face -->
  <rect x="21" y="18" width="9" height="9" fill="#d99a78"/><rect x="23" y="20" width="6" height="5" fill="#efb994"/>
  <path d="M15 8h21v13l-4 7H20l-5-7z" fill="#eab18d"/>
  <rect x="13" y="13" width="3" height="7" fill="#d48c6c"/><rect x="35" y="13" width="3" height="7" fill="#d48c6c"/>
  <!-- hair -->
  <path d="M14 13V8l4-5h16l5 5v9h-4l-2-7-5 3-8-2-2 5h-4z" fill="#49312d"/>
  <path d="M18 5h13l4 3H17z" fill="#68453a"/><rect x="16" y="10" width="3" height="6" fill="#49312d"/>
  <!-- face details -->
  <rect x="20" y="16" width="3" height="3" fill="#302a35"/><rect x="30" y="16" width="3" height="3" fill="#302a35"/>
  <rect x="21" y="15" width="2" height="1" fill="#fff1df"/><rect x="31" y="15" width="2" height="1" fill="#fff1df"/>
  <rect x="26" y="20" width="3" height="2" fill="#c77c68"/><rect x="24" y="24" width="6" height="1" fill="#a95d58"/>
  <rect x="16" y="18" width="3" height="2" fill="#f5c7a5"/><rect x="34" y="18" width="3" height="2" fill="#f5c7a5"/>
 </g>
 <g id="bride">
  <!-- shadow -->
  <rect x="8" y="60" width="32" height="3" fill="#26304b" opacity=".35"/>
  <!-- shoes -->
  <path d="M14 57h10v4H9v-3h5zM29 57h9v4H25v-3h4z" fill="#8a5b62"/>
  <!-- gown silhouette -->
  <path d="M19 24h14l5 10 7 24H5l7-24z" fill="#f2e6df"/>
  <path d="M19 27h14l3 9-5 22H14l-3-22z" fill="#fff8ef"/>
  <path d="M12 37h8l-4 18H8z" fill="#d8b9c0"/><path d="M33 37h8l4 18H29z" fill="#e6cbd0"/>
  <path d="M22 28h8l-2 11-3 5-4-5z" fill="#d99cad"/>
  <path d="M23 29h5v7h-5z" fill="#fff9f2"/>
  <rect x="18" y="43" width="4" height="3" fill="#d4b0b9"/><rect x="31" y="45" width="4" height="3" fill="#d4b0b9"/>
  <!-- lace highlights -->
  <rect x="9" y="49" width="3" height="3" fill="#fffdf8"/><rect x="37" y="50" width="3" height="3" fill="#fffdf8"/>
  <rect x="18" y="52" width="3" height="3" fill="#fffdf8"/><rect x="29" y="54" width="3" height="3" fill="#fffdf8"/>
  <!-- arms -->
  <path d="M14 29h-5v13h6v-6h3v-5z" fill="#f0dcd6"/><rect x="9" y="40" width="6" height="5" fill="#e7ad8e"/>
  <path d="M34 29h5v13h-6v-6h-3v-5z" fill="#e4c9c8"/><rect x="34" y="40" width="6" height="5" fill="#e7ad8e"/>
  <!-- neck and face -->
  <rect x="22" y="18" width="9" height="9" fill="#e7ad8e"/>
  <path d="M15 8h22v13l-5 7H20l-5-7z" fill="#efbd9d"/>
  <rect x="13" y="14" width="3" height="7" fill="#d9977b"/><rect x="36" y="14" width="3" height="7" fill="#d9977b"/>
  <!-- long chestnut hair -->
  <path d="M13 14V8l5-6h16l6 7v25h-5l-2-15-4-6-8 2-3 8-2 13h-5V15z" fill="#57362f"/>
  <path d="M17 6l4-3h11l5 5-7-2-5 3-8-1z" fill="#80513e"/>
  <path d="M14 19h4v16h-4zM35 19h4v18h-4z" fill="#704436"/>
  <!-- hair shine -->
  <rect x="19" y="5" width="5" height="2" fill="#a36a4e"/><rect x="28" y="4" width="4" height="2" fill="#a36a4e"/>
  <!-- tiara -->
  <path d="M19 8l3-4 4 3 4-3 4 4" fill="none" stroke="#f4d47b" stroke-width="2"/>
  <rect x="21" y="5" width="2" height="2" fill="#fff0b0"/><rect x="30" y="5" width="2" height="2" fill="#fff0b0"/>
  <!-- face details -->
  <rect x="20" y="16" width="3" height="3" fill="#342a36"/><rect x="30" y="16" width="3" height="3" fill="#342a36"/>
  <rect x="21" y="15" width="2" height="1" fill="#fff3e7"/><rect x="31" y="15" width="2" height="1" fill="#fff3e7"/>
  <rect x="26" y="20" width="3" height="2" fill="#d28a7a"/><rect x="24" y="24" width="6" height="1" fill="#b96f70"/>
  <rect x="16" y="19" width="3" height="2" fill="#f7cbb0"/><rect x="35" y="19" width="3" height="2" fill="#f7cbb0"/>
 </g>
</defs>
<!-- Idle, walk, stride, jump, celebration. Each cell is 48x64. -->
<g><use href="#groom"/><use href="#bride" x="0" y="64"/></g>
<g transform="translate(48 0)"><use href="#groom"/><path d="M14 47h8v10h-8z" fill="#263c70"/><path d="M29 42h8v10h-8z" fill="#263c70"/><path d="M9 58h11v4H9zM29 55h12v4H29z" fill="#18243d"/><use href="#bride" y="64"/><path d="M13 57h10v4H13zM30 54h9v5h-9z" fill="#8a5b62"/></g>
<g transform="translate(96 0)"><use href="#groom"/><path d="M13 42h8v10h-8zM29 47h8v10h-8z" fill="#263c70"/><path d="M8 52h12v5H8zM28 59h12v3H28z" fill="#18243d"/><use href="#bride" y="64"/><path d="M12 53h10v5H12zM30 58h10v4H30z" fill="#8a5b62"/></g>
<g transform="translate(144 0)"><use href="#groom"/><path d="M7 20h7v12H7zM35 18h7v12h-7z" fill="#263e78"/><rect x="4" y="15" width="6" height="6" fill="#d99a78"/><rect x="39" y="13" width="6" height="6" fill="#d99a78"/><use href="#bride" y="64"/><path d="M7 84h7v12H7zM35 82h7v12h-7z" fill="#f0dcd6"/><rect x="4" y="79" width="6" height="6" fill="#e7ad8e"/><rect x="39" y="77" width="6" height="6" fill="#e7ad8e"/></g>
<g transform="translate(192 0)"><use href="#groom"/><path d="M7 20h7v12H7zM35 18h7v12h-7z" fill="#263e78"/><rect x="4" y="15" width="6" height="6" fill="#d99a78"/><rect x="39" y="13" width="6" height="6" fill="#d99a78"/><rect x="23" y="1" width="5" height="4" fill="#ffe18a"/><use href="#bride" y="64"/><path d="M7 84h7v12H7zM35 82h7v12h-7z" fill="#f0dcd6"/><rect x="4" y="79" width="6" height="6" fill="#e7ad8e"/><rect x="39" y="77" width="6" height="6" fill="#e7ad8e"/><rect x="23" y="65" width="5" height="4" fill="#ffe18a"/></g>
