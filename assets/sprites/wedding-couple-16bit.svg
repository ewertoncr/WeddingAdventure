<svg xmlns="http://www.w3.org/2000/svg" width="160" height="96" viewBox="0 0 160 96" shape-rendering="crispEdges">
<!-- Wedding Adventure original 16-bit character atlas: five 32x48 frames per row. -->
<defs>
 <g id="groom">
  <rect x="9" y="43" width="14" height="3" fill="#26365c"/><rect x="10" y="38" width="6" height="7" fill="#253a70"/><rect x="18" y="38" width="6" height="7" fill="#253a70"/>
  <rect x="8" y="43" width="8" height="3" fill="#5a4035"/><rect x="18" y="43" width="8" height="3" fill="#5a4035"/>
  <rect x="9" y="22" width="15" height="18" fill="#31589b"/><rect x="14" y="22" width="5" height="17" fill="#e9b95e"/><rect x="10" y="26" width="13" height="3" fill="#547cc0"/>
  <rect x="5" y="24" width="5" height="12" fill="#31589b"/><rect x="23" y="24" width="5" height="12" fill="#31589b"/><rect x="4" y="33" width="5" height="5" fill="#e9aa83"/><rect x="24" y="33" width="5" height="5" fill="#e9aa83"/>
  <rect x="13" y="17" width="7" height="7" fill="#d99570"/><rect x="9" y="5" width="16" height="14" fill="#f0b58f"/>
  <rect x="8" y="3" width="17" height="7" fill="#47302c"/><rect x="11" y="0" width="13" height="5" fill="#654236"/><rect x="7" y="7" width="4" height="10" fill="#49312c"/><rect x="23" y="7" width="4" height="8" fill="#49312c"/>
  <rect x="12" y="11" width="3" height="3" fill="#27324b"/><rect x="20" y="11" width="3" height="3" fill="#27324b"/><rect x="16" y="16" width="4" height="1" fill="#a65b55"/>
  <rect x="10" y="24" width="3" height="3" fill="#8ca9d8"/><rect x="22" y="24" width="3" height="3" fill="#8ca9d8"/>
 </g>
 <g id="bride">
  <rect x="9" y="43" width="14" height="3" fill="#68483c"/><rect x="10" y="38" width="6" height="7" fill="#fff0e7"/><rect x="18" y="38" width="6" height="7" fill="#fff0e7"/>
  <path d="M10 22h13v13l5 8H5l5-8z" fill="#f1c9d5"/><rect x="12" y="22" width="10" height="15" fill="#fffaf0"/><rect x="14" y="25" width="6" height="8" fill="#e8a9bd"/>
  <rect x="6" y="24" width="5" height="11" fill="#f1c9d5"/><rect x="23" y="24" width="5" height="11" fill="#f1c9d5"/><rect x="4" y="33" width="5" height="5" fill="#e9aa83"/><rect x="25" y="33" width="5" height="5" fill="#e9aa83"/>
  <rect x="13" y="17" width="7" height="7" fill="#d99570"/><rect x="9" y="5" width="16" height="14" fill="#f0b58f"/>
  <rect x="7" y="3" width="19" height="7" fill="#57372f"/><rect x="10" y="0" width="14" height="5" fill="#70463a"/><rect x="6" y="7" width="5" height="15" fill="#57372f"/><rect x="23" y="7" width="5" height="15" fill="#57372f"/>
  <rect x="12" y="11" width="3" height="3" fill="#27324b"/><rect x="20" y="11" width="3" height="3" fill="#27324b"/><rect x="16" y="16" width="4" height="1" fill="#a65b55"/>
  <rect x="9" y="0" width="4" height="4" fill="#ffe7a4"/><rect x="20" y="0" width="4" height="4" fill="#ffe7a4"/><rect x="24" y="5" width="3" height="4" fill="#ffe7a4"/>
 </g>
</defs>
<!-- Walk cycle frames -->
<g><use href="#groom"/><use href="#bride" y="48"/></g>
<g transform="translate(32 0)"><use href="#groom"/><rect x="7" y="42" width="9" height="4" fill="#5a4035"/><rect x="20" y="40" width="8" height="4" fill="#5a4035"/><rect x="4" y="25" width="5" height="10" fill="#31589b"/></g>
<g transform="translate(32 48)"><use href="#bride"/><rect x="7" y="42" width="9" height="4" fill="#68483c"/><rect x="20" y="40" width="8" height="4" fill="#68483c"/></g>
<g transform="translate(64 0)"><use href="#groom"/><rect x="9" y="40" width="8" height="4" fill="#5a4035"/><rect x="18" y="42" width="9" height="4" fill="#5a4035"/><rect x="23" y="25" width="5" height="10" fill="#31589b"/></g>
<g transform="translate(64 48)"><use href="#bride"/><rect x="9" y="40" width="8" height="4" fill="#68483c"/><rect x="18" y="42" width="9" height="4" fill="#68483c"/></g>
<!-- Jump / arms up -->
<g transform="translate(96 0)"><use href="#groom"/><rect x="2" y="16" width="5" height="12" fill="#31589b"/><rect x="25" y="16" width="5" height="12" fill="#31589b"/><rect x="1" y="12" width="5" height="5" fill="#e9aa83"/><rect x="26" y="12" width="5" height="5" fill="#e9aa83"/></g>
<g transform="translate(96 48)"><use href="#bride"/><rect x="2" y="16" width="5" height="12" fill="#f1c9d5"/><rect x="25" y="16" width="5" height="12" fill="#f1c9d5"/><rect x="1" y="12" width="5" height="5" fill="#e9aa83"/><rect x="26" y="12" width="5" height="5" fill="#e9aa83"/></g>
<!-- Celebrate pose -->
<g transform="translate(128 0)"><use href="#groom"/><rect x="3" y="15" width="5" height="12" fill="#31589b"/><rect x="24" y="15" width="5" height="12" fill="#31589b"/><rect x="2" y="10" width="5" height="5" fill="#e9aa83"/><rect x="25" y="10" width="5" height="5" fill="#e9aa83"/><rect x="13" y="1" width="6" height="3" fill="#ffe18a"/></g>
<g transform="translate(128 48)"><use href="#bride"/><rect x="3" y="15" width="5" height="12" fill="#f1c9d5"/><rect x="24" y="15" width="5" height="12" fill="#f1c9d5"/><rect x="2" y="10" width="5" height="5" fill="#e9aa83"/><rect x="25" y="10" width="5" height="5" fill="#e9aa83"/><rect x="13" y="1" width="6" height="3" fill="#ffe18a"/></g>
</svg>