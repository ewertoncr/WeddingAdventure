<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wedding Adventure — A Caminho da Noiva</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0c1128;font-family:Arial,sans-serif}
body{display:grid;place-items:center}.game{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);overflow:hidden;border-radius:18px;box-shadow:0 18px 60px #0008;background:#6ac8f0}
canvas{width:100%;height:100%;display:block}
.touch{position:absolute;left:22px;right:22px;bottom:18px;display:flex;justify-content:space-between;pointer-events:none}.touch .cluster{display:flex;gap:12px}
.touch button{pointer-events:auto;width:64px;height:64px;border:2px solid #ffffff99;border-radius:50%;background:#14203dcc;color:#fff;font-weight:900;font-size:24px;box-shadow:0 5px 16px #0006}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#293f79,#090d20);color:white;font-size:22px;z-index:5}
</style></head>
<body><div class="game"><div id="loading">Carregando Wedding Adventure…</div><canvas id="c" width="1280" height="720"></canvas>
<div class="touch"><div class="cluster"><button data-k="left">◀</button><button data-k="right">▶</button></div><div class="cluster"><button data-k="jump">▲</button></div></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');const W=1280,H=720;
const AS='/WeddingAdventure/assets/art/';const groom=new Image(),bride=new Image(),world=new Image();
groom.src=AS+'groom-hero.svg';bride.src=AS+'bride-hero.svg';world.src=AS+'enchanted-kingdom.svg';
let ready=0;[groom,bride,world].forEach(i=>i.onload=()=>{if(++ready===3)document.getElementById('loading').remove()});
const key={};addEventListener('keydown',e=>{key[e.key.toLowerCase()]=1;if([' ','arrowup','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener('keyup',e=>key[e.key.toLowerCase()]=0);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=()=>key[k]=1;b.onpointerup=b.onpointercancel=()=>key[k]=0});
let started=false,finish=false,t=0,score=0,cam=0;const p={x:90,y:520,vx:0,vy:0,on:false};
const platforms=[[0,610,430],[470,610,430],[950,610,330],[1370,610,480],[1900,610,540],[2490,610,620],[3200,610,680]];
const coins=[360,570,680,1040,1190,1450,1570,2010,2160,2590,2740,3330,3480];const enemies=[760,1150,1510,2070,2670,3430];const endX=3650;
function rect(x,y,w,h,f){X.fillStyle=f;X.fillRect(x,y,w,h)}
function platform(x,y,w){X.fillStyle='#6d422d';X.beginPath();X.moveTo(x,y);X.quadraticCurveTo(x+w*.25,y-8,x+w*.5,y);X.quadraticCurveTo(x+w*.75,y-8,x+w,y);X.lineTo(x+w,y+90);X.lineTo(x,y+90);X.closePath();X.fill();X.fillStyle='#3e9d51';X.beginPath();X.moveTo(x,y);X.quadraticCurveTo(x+w*.25,y-9,x+w*.5,y);X.quadraticCurveTo(x+w*.75,y-9,x+w,y);X.lineTo(x+w,y+15);X.quadraticCurveTo(x+w*.75,y+8,x+w*.5,y+15);X.quadraticCurveTo(x+w*.25,y+7,x,y+15);X.closePath();X.fill();X.fillStyle='#8fe15e';X.fillRect(x,y,w,4);for(let i=25;i<w;i+=60)flower(x+i,y+12,.42)}
addEventListener('pointerdown',()=>{started=true});function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
