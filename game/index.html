<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wedding Adventure — Reino do Amor</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07152d;touch-action:none}
body{display:grid;place-items:center}
canvas{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block}
</style>
</head>
<body>
<canvas id="g" width="1280" height="720"></canvas>
<script>
const c=document.getElementById("g"),x=c.getContext("2d"),W=1280,H=720,K={};
onkeydown=e=>{K[e.key.toLowerCase()]=1;if(e.key==" ")e.preventDefault()};
onkeyup=e=>K[e.key.toLowerCase()]=0;
let P,E,C,G,cam=0,score=0,lives=5,win=0;
const S=[
{x:0,y:610,w:430,h:110},{x:480,y:575,w:180,h:145},{x:710,y:515,w:150,h:205},
{x:900,y:590,w:380,h:130},{x:410,y:500,w:100,h:20},{x:650,y:445,w:130,h:20},
{x:815,y:385,w:120,h:20},{x:1030,y:445,w:150,h:20}];
function reset(){P={x:100,y:450,w:55,h:85,vx:0,vy:0,d:1,g:0,a:0,t:0};E=[{x:1140,y:500,v:-1.2,m:1030,M:1200,dead:0}];C=[[440,455],[485,410],[530,365],[690,405],[735,360],[770,315],[860,345],[910,310],[1040,405],[1090,365]].map(q=>({x:q[0],y:q[1],z:0}));G=[[785,410],[1010,380]].map(q=>({x:q[0],y:q[1],z:0}));score=0;lives=5;win=0;cam=0}reset();
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function bg(){
let q=x.createLinearGradient(0,0,0,H);q.addColorStop(0,"#2d82dc");q.addColorStop(.6,"#9acdf0");q.addColorStop(1,"#f2a8ca");x.fillStyle=q;x.fillRect(0,0,W,H);
x.fillStyle="#fff5bd";x.beginPath();x.arc(1050,105,62,0,7);x.fill();
x.fillStyle="#6688c5";x.beginPath();x.moveTo(0,410);for(let i=0;i<=W;i+=90)x.lineTo(i,330+Math.sin(i*.018)*60);x.lineTo(W,H);x.lineTo(0,H);x.fill();
let z=940-cam*.12;x.fillStyle="#e9e0d4";x.fillRect(z-180,245,360,145);
for(let i=-2;i<3;i++){let t=z+i*72;x.fillRect(t-28,180,56,205);x.fillStyle="#384b92";x.beginPath();x.moveTo(t-38,180);x.lineTo(t,115);x.lineTo(t+38,180);x.fill();x.fillStyle="#e9e0d4";x.fillRect(t-8,225,16,25)}
for(let i=0;i<3;i++){let q=130+i*400-cam*.12;x.strokeStyle="#b9efff";x.lineWidth=16;x.beginPath();x.moveTo(q,280);x.lineTo(q+10,500);x.stroke()}
}
function terrain(){for(const s of S){let q=s.x-cam;if(q+s.w<0||q>W)continue;x.fillStyle="#765344";x.fillRect(q,s.y,s.w,s.h);x.fillStyle="#4f9c53";x.fillRect(q,s.y,s.w,14);for(let z=q+18;z<q+s.w;z+=45){x.fillStyle="#e95a92";x.beginPath();x.arc(z,s.y+3,5,0,7);x.fill()}}}
function groom(){
let q=P.x-cam+27,r=P.y+42;x.save();x.translate(q,r);if(P.d<0)x.scale(-1,1);let a=Math.sin(P.t)*5;
x.fillStyle="rgba(0,0,0,.22)";x.beginPath();x.ellipse(0,44,34,7,0,0,7);x.fill();
x.fillStyle="#162d75";x.strokeStyle="#d9a83d";x.lineWidth=3;x.beginPath();x.moveTo(-24,-18);x.lineTo(-48,28);x.lineTo(-10,36);x.lineTo(6,-5);x.closePath();x.fill();x.stroke();
x.strokeStyle="#171b2d";x.lineWidth=11;x.beginPath();x.moveTo(-10,18);x.lineTo(-17,43+a);x.moveTo(9,18);x.lineTo(20,42-a);x.stroke();
x.fillStyle="#573622";x.fillRect(-27,38+a,22,10);x.fillRect(12,37-a,22,10);
x.fillStyle="#243e94";x.strokeStyle="#d9a83d";x.beginPath();x.roundRect(-25,-27,50,55,10);x.fill();x.stroke();
x.fillStyle="#fff8ec";x.beginPath();x.moveTo(-11,-25);x.lineTo(0,-8);x.lineTo(11,-25);x.fill();
x.fillStyle="#b92845";x.beginPath();x.moveTo(0,-13);x.lineTo(6,0);x.lineTo(0,12);x.lineTo(-6,0);x.fill();
x.strokeStyle="#243e94";x.lineWidth=11;x.beginPath();x.moveTo(-20,-15);x.lineTo(-38,5+a);x.moveTo(20,-15);x.lineTo(37,-2-a);x.stroke();
x.fillStyle="#e8b28d";x.beginPath();x.arc(0,-47,22,0,7);x.fill();x.fillStyle="#552d1c";x.beginPath();x.arc(0,-56,22,Math.PI,7);x.fill();x.fillStyle="#48291e";x.beginPath();x.arc(0,-40,14,0,Math.PI);x.fill();x.fillStyle="#211714";x.fillRect(-8,-50,4,4);x.fillRect(4,-50,4,4);x.restore();
}
function bride(){let q=P.x-cam-35,r=P.y+18+bob();x.save();x.translate(q,r);x.fillStyle="#fffaf2";x.strokeStyle="#d8b16a";x.lineWidth=2;x.beginPath();x.moveTo(-14,-20);x.lineTo(-38,42);x.lineTo(38,42);x.lineTo(14,-20);x.fill();x.stroke();x.fillStyle="#70401f";x.beginPath();x.arc(0,-34,24,0,7);x.fill();x.fillStyle="#efbd9b";x.beginPath();x.arc(0,-39,18,0,7);x.fill();x.fillStyle="rgba(255,255,255,.7)";x.beginPath();x.moveTo(0,-52);x.quadraticCurveTo(-44,-35,-42,5);x.quadraticCurveTo(0,-10,42,5);x.quadraticCurveTo(40,-35,0,-52);x.fill();x.stroke();x.fillStyle="#e85883";x.beginPath();x.arc(27,0,9,0,7);x.arc(34,6,8,0,7);x.fill();x.restore()}
function bob(){return Math.sin(Date.now()/220)*3}
function enemy(){for(const e of E)if(!e.dead){let q=e.x-cam;x.fillStyle="#737b86";x.strokeStyle="#262a34";x.lineWidth=4;x.beginPath();x.roundRect(q+5,e.y,50,55,12);x.fill();x.stroke();x.fillStyle="#969da6";x.beginPath();x.arc(q+30,e.y+4,25,Math.PI,7);x.fill();x.fillStyle="#151823";x.fillRect(q+8,e.y+3,44,12);x.fillStyle="#ef4b50";x.fillRect(q+17,e.y+7,5,5);x.fillRect(q+29,e.y+7,5,5);x.strokeStyle="#eee";x.lineWidth=6;x.beginPath();x.moveTo(q+53,e.y+30);x.lineTo(q+78,e.y+5);x.stroke()}}
function update(){
if(win)return;let l=K.a||K.arrowleft,r=K.d||K.arrowright;
if(l){P.vx-=.65;P.d=-1}if(r){P.vx+=.65;P.d=1}if(!l&&!r)P.vx*=.82;P.vx=Math.max(-5,Math.min(5,P.vx));
if((K[" "]||K.w||K.arrowup)&&P.g){P.vy=-12;P.g=0}if(K.j&&P.a<=0)P.a=18;if(P.a>0)P.a--;
P.vy+=.65;P.x+=P.vx;P.y+=P.vy;P.g=0;
for(const s of S)if(P.x+P.w>s.x&&P.x<s.x+s.w&&P.y+P.h>s.y&&P.y+P.h-P.vy<=s.y){P.y=s.y-P.h;P.vy=0;P.g=1}
if(P.y>780){lives--;P.x=100;P.y=400;P.vy=0;if(lives<=0)reset()}
for(const c of C)if(!c.z&&Math.hypot(P.x+27-c.x,P.y+35-c.y)<35){c.z=1;score+=100}
for(const g of G)if(!g.z&&Math.hypot(P.x+27-g.x,P.y+35-g.y)<38){g.z=1;score+=500}
for(const e of E){if(e.dead)continue;e.x+=e.v;if(e.x<e.m||e.x>e.M)e.v*=-1;let a={x:P.d>0?P.x+P.w:P.x-55,y:P.y+15,w:55,h:45};let b={x:e.x,y:e.y,w:60,h:70};if(P.a>5&&hit(a,b)){e.dead=1;score+=1000}if(!e.dead&&hit(P,b)){lives--;P.x-=P.d*50;P.vy=-6;if(lives<=0)reset()}}
if(P.x>1160&&E.every(e=>e.dead))win=1;cam+=(Math.max(0,Math.min(700,P.x-300))-cam)*.08;P.t+=Math.abs(P.vx)*.25}
function hud(){x.fillStyle="rgba(7,16,40,.86)";x.strokeStyle="#e5b74e";x.lineWidth=3;x.beginPath();x.roundRect(20,18,390,82,16);x.fill();x.stroke();x.fillStyle="#fff";x.font="bold 25px Georgia";x.fillText("Wedding Adventure",42,50);x.font="15px Arial";x.fillStyle="#ffd447";x.fillText("REINO DO AMOR • FASE 1",42,77);x.fillStyle="#ff405f";x.font="25px Arial";x.fillText("♥".repeat(lives),250,50);x.fillStyle="#ffd447";x.font="bold 17px Arial";x.fillText("● "+C.filter(q=>q.z).length,250,78);x.fillStyle="#e969ff";x.fillText("◆ "+G.filter(q=>q.z).length,315,78);x.fillStyle="#172342";x.strokeStyle="#e5b74e";x.beginPath();x.arc(1215,55,32,0,7);x.fill();x.stroke();x.fillStyle="#fff";x.fillRect(1204,42,7,26);x.fillRect(1218,42,7,26)}
function controls(){x.globalAlpha=.75;for(const [q,t] of [[80,"←"],[185,"→"],[W-180,"↑"],[W-80,"⚔"]]){x.fillStyle="#39271b";x.strokeStyle="#e8b84e";x.lineWidth=4;x.beginPath();x.arc(q,H-80,48,0,7);x.fill();x.stroke();x.fillStyle="#fff";x.font="bold 32px Arial";x.textAlign="center";x.textBaseline="middle";x.fillText(t,q,H-80)}x.textAlign="left";x.textBaseline="alphabetic";x.globalAlpha=1}
function draw(){bg();terrain();for(const c of C)if(!c.z){let q=c.x-cam;x.fillStyle="#ffd13b";x.beginPath();x.ellipse(q,c.y,12,17,0,0,7);x.fill()}for(const g of G)if(!g.z){let q=g.x-cam;x.fillStyle="#d85aff";x.beginPath();x.moveTo(q,g.y-20);x.lineTo(q+14,g.y);x.lineTo(q,g.y+20);x.lineTo(q-14,g.y);x.fill()}enemy();bride();groom();hud();controls();if(win){x.fillStyle="rgba(4,8,20,.7)";x.fillRect(0,0,W,H);x.fillStyle="#fff";x.textAlign="center";x.font="bold 54px Georgia";x.fillText("FASE CONCLUÍDA!",W/2,320);x.font="22px Arial";x.fillText("O amor venceu!  •  Pontuação: "+score,W/2,365);x.textAlign="left"}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
